[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-for-ai-lesson7"
version = "1.0.0"
description = "Reproducible regularization and generalization lesson with Manim animations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "manim>=0.19", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
